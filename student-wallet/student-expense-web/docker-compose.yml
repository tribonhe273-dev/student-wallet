services:
  chi-tieu-sinh-vien:
    build: .
    container_name: chi-tieu-sinh-vien
    ports:
      - "8080:5000"
    environment:
      DATABASE_PATH: /data/expenses.db
      PORT: 5000
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_FILE: /data/.secret_key
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - expense_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  expense_data:
